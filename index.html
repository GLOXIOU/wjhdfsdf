<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Redirection...</title>
    <meta http-equiv="refresh" content="0; url=../index/index.html">
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        window.location.href = "/index/index.html?token=" + encodeURIComponent(token);
    </script>
</head>
<body>
    <p>Redirection en cours... Si rien ne se passe, <a href="./index/index.html">cliquez ici</a>.</p>
</body>
</html>
