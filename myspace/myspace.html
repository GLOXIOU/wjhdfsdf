<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainrotStars — Mon Espace</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../index/style.css" />
  <link rel="stylesheet" href="myspace.css" />
  <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/schoolllex/images/refs/heads/main/BrainrotStar/favicon.ico">
</head>
<body>
  <div class="background-glow">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
  </div>

  <div class="container">
    <header class="navbar">
      <div class="logo">
        <a href="../index/index.html" class="nav-link">
          <img src="https://raw.githubusercontent.com/schoolllex/images/refs/heads/main/BrainrotStar/BrainrotStar_logo_fc.png" alt="Brainrot Star" class="logo-image" />
        </a>
      </div>
      <button class="nav-toggle" type="button" aria-label="Ouvrir le menu" aria-expanded="false">
        <i data-lucide="menu"></i>
      </button>
      <div class="nav-buttons">
        <a href="../index/index.html" class="btn-nav nav-link">
          <i data-lucide="home"></i>
          <span>Accueil</span>
        </a>
        <a href="../shop/shop.html" class="btn-nav shop nav-link">
          <i data-lucide="store"></i>
          <span>Boutique</span>
        </a>
        <a href="../collection/collection.html" class="btn-nav collection nav-link">
          <i data-lucide="library"></i>
          <span>Collection</span>
        </a>
        <a href="../ranking/ranking.html" class="btn-nav ranking nav-link">
          <i data-lucide="trophy"></i>
          <span>Classement</span>
        </a>
        <button type="button" class="btn-nav profile nav-link">
          <i data-lucide="user"></i>
          <span>Profil</span>
        </button>
</div>
    </header>

    <main class="myspace-content">
      <section class="myspace-header-card">
        <div class="myspace-header-row">
          <h1>Mon Espace</h1>
          <div class="wallet-badge">
            <i data-lucide="wallet"></i>
            <span id="wallet-value">0</span>
          </div>
        </div>
      </section>

      <section class="myspace-map-section">
        <h2>Ma Base</h2>
        <div id="myspace-map" class="myspace-map">
          <canvas id="myspace-canvas" width="500" height="500"></canvas>
        </div>
      </section>

      <section class="batiments-shop-section">
        <h2>Construire des Bâtiments</h2>
        <div id="batiments-grid" class="batiments-grid"></div>
      </section>

      <section class="my-batiments-section">
        <h2>Mes Bâtiments</h2>
        <div id="my-batiments-list" class="my-batiments-list"></div>
      </section>
    </main>
  </div>

  <!-- Modal de confirmation de construction -->
  <div id="build-modal" class="build-modal hidden" role="dialog" aria-modal="true">
    <div class="build-modal-overlay" data-close-modal="true"></div>
    <div class="build-modal-card">
      <button id="build-modal-close" class="build-modal-close" type="button" aria-label="Fermer">
        <i data-lucide="x"></i>
      </button>
      <div class="build-modal-head">
        <h3 id="build-modal-title">Construire un bâtiment</h3>
        <p id="build-modal-description" class="build-modal-description"></p>
      </div>

      <div class="build-modal-info">
        <div class="build-info-item">
          <span class="build-info-label">Coût :</span>
          <span id="build-modal-cost" class="build-info-value">0 💰</span>
        </div>
        <div class="build-info-item">
          <span class="build-info-label">Temps de construction :</span>
          <span id="build-modal-time" class="build-info-value">0s</span>
        </div>
        <div class="build-info-item">
          <span class="build-info-label">Production d'or :</span>
          <span id="build-modal-production" class="build-info-value">0/s</span>
        </div>
      </div>

      <div class="build-modal-position">
        <div class="position-group">
          <label for="build-modal-x">Position X (0-19):</label>
          <input id="build-modal-x" type="number" min="0" max="19" value="10">
        </div>
        <div class="position-group">
          <label for="build-modal-y">Position Y (0-19):</label>
          <input id="build-modal-y" type="number" min="0" max="19" value="10">
        </div>
        <div class="position-validation" data-position-validation>✓ Position valide</div>
      </div>

      <div class="build-modal-actions">
        <button id="build-modal-cancel" class="btn-cancel" type="button">Annuler</button>
        <button id="build-modal-confirm" class="btn-confirm" type="button">Construire</button>
      </div>
    </div>
  </div>

  <div id="notification" class="notification hidden"></div>

  <script src="../assets/config.js"></script>
  <script src="../assets/playweb-analytics.js"></script>

  <script src="../assets/shared-nav.js"></script>
  <script src="../assets/mobile-nav.js"></script>
  <script src="../assets/auth-gate.js"></script>
  <script src="../assets/notif.js"></script>
  <script src="myspace.js"></script>
</body>
</html>
