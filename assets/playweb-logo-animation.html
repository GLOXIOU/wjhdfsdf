<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlayWeb – Logo animé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<style>
:root{
  --ink:#12161a; --blue:#154a8a; --orange:#d9531c; --white:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--white);overflow:hidden;font-family:"Fredoka","Nunito",system-ui,sans-serif}

/* Fond : deux nappes de lumière qui dérivent */
.bg{position:fixed;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:0;will-change:transform}
.b1{width:60vmax;height:60vmax;background:var(--blue);top:-30vmax;right:-10vmax;animation:in 2s .2s forwards, driftA 14s ease-in-out infinite alternate}
.b2{width:55vmax;height:55vmax;background:var(--orange);bottom:-32vmax;right:-14vmax;animation:in 2s .6s forwards, driftB 12s ease-in-out infinite alternate}
@keyframes in{to{opacity:.85}}
@keyframes driftA{to{transform:translate(-8vmax,10vmax) scale(1.15)}}
@keyframes driftB{to{transform:translate(-14vmax,-8vmax) scale(1.2)}}

/* Scène */
.stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.5vmin,14px);perspective:900px}
.tilt{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.5vmin,14px);transition:transform .25s ease-out;transform-style:preserve-3d}
svg.logo{width:min(46vmin,360px);height:auto;overflow:visible;filter:drop-shadow(0 20px 50px rgba(0,0,0,.35))}
.float{animation:float 5s ease-in-out 3.2s infinite alternate}
@keyframes float{to{transform:translateY(-8px)}}

/* Contour qui se dessine, puis le triangle se remplit */
.outline{fill:none;stroke:#fff;stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000}
.tri{fill:#fff;transform-box:fill-box;transform-origin:center;opacity:0}
.pad,.dpad,.dot{transform-box:fill-box;transform-origin:center}
.pad{transform:scale(0)}
.dpad,.dot{transform:scale(0)}

.play .outline{animation:draw 1.1s cubic-bezier(.6,.05,.2,1) .3s forwards, fade .5s 1.5s forwards}
.play .tri{animation:pop .8s cubic-bezier(.2,1.2,.3,1) 1.1s forwards}
.play .pad{animation:padIn .7s cubic-bezier(.2,1.5,.35,1) 1.7s forwards}
.play .dpad{animation:padIn .5s cubic-bezier(.2,1.6,.35,1) 2.05s forwards}
.play .dot{animation:padIn .45s cubic-bezier(.2,1.8,.35,1) forwards}
.play .dot:nth-of-type(1){animation-delay:2.15s}
.play .dot:nth-of-type(2){animation-delay:2.22s}
.play .dot:nth-of-type(3){animation-delay:2.29s}
.play .dot:nth-of-type(4){animation-delay:2.36s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes padIn{to{transform:scale(1)}}

/* Wordmark : chaque lettre monte depuis un masque */
.word{display:flex;font-weight:700;font-size:min(15vmin,120px);line-height:1;letter-spacing:-.01em}
.word span{display:inline-block;overflow:hidden;padding:.08em .02em .32em;margin-bottom:-.26em}
.word i{display:inline-block;font-style:normal;transform:translateY(130%) rotate(6deg)}
.play .word i{animation:rise .75s cubic-bezier(.2,.9,.25,1.15) forwards;animation-delay:calc(2.3s + var(--n) * .07s)}
@keyframes rise{to{transform:none}}

/* Reflet qui balaye le mot une fois */
.word{position:relative}
.word::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);background-size:250% 100%;background-position:130% 0;mix-blend-mode:overlay;pointer-events:none}
.play .word::after{animation:shine 1.2s ease-in-out 3.2s 1 both}
@keyframes shine{to{background-position:-40% 0}}


@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
  .blob{opacity:.85}
}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>

<main class="stage play" id="stage" aria-label="Logo PlayWeb animé">
  <div class="tilt" id="tilt">
    <div class="float">
      <svg class="logo" viewBox="0 0 400 400" role="img" aria-label="Logo PlayWeb : bouton lecture avec une manette">
        <defs>
          <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
            <rect width="400" height="400" fill="#fff"/>
            <g transform="translate(92 148) scale(1.15)">
              <path class="pad" fill="#000" d="M20 8Q30 0 45 4L48 6H72L75 4Q90 0 100 8Q108 30 116 58Q120 78 104 82Q92 84 80 70Q74 64 66 64H54Q46 64 40 70Q28 84 16 82Q0 78 4 58Q12 30 20 8Z"/>
            </g>
            <g transform="translate(92 148) scale(1.15)" fill="#fff">
              <g class="dpad">
                <rect x="26" y="26" width="10" height="28" rx="4"/>
                <rect x="17" y="35" width="28" height="10" rx="4"/>
              </g>
              <circle class="dot" cx="86" cy="26" r="5.5"/>
              <circle class="dot" cx="76" cy="36" r="5.5"/>
              <circle class="dot" cx="96" cy="36" r="5.5"/>
              <circle class="dot" cx="86" cy="46" r="5.5"/>
            </g>
          </mask>
        </defs>
        <polygon class="outline" points="60,32 60,368 356,200" stroke-linejoin="round" pathLength="1000"/>
        <g mask="url(#cut)">
          <polygon class="tri" points="85,65 85,335 320,200" stroke="#fff" stroke-width="52" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>
    <div class="word" id="word" aria-label="PlayWeb"></div>
  </div>
</main>

<script>
(function(){
  var stage=document.getElementById('stage'), tilt=document.getElementById('tilt'), word=document.getElementById('word');
  "PlayWeb".split("").forEach(function(ch,i){
    var s=document.createElement('span'), l=document.createElement('i');
    l.textContent=ch; l.style.setProperty('--n',i); s.appendChild(l); word.appendChild(s);
  });
  // Léger effet 3D qui suit la souris / le doigt
  function move(x,y){
    var rx=(y/innerHeight-.5)*-10, ry=(x/innerWidth-.5)*12;
    tilt.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';
  }
  addEventListener('pointermove',function(e){move(e.clientX,e.clientY)});
  addEventListener('pointerleave',function(){tilt.style.transform=''});
})();
</script>
</body>
</html>
